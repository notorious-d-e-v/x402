[project]
name = "x402-svm-batch-smoke"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["x402[svm,flask,httpx]"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.uv.sources]
x402 = { path = "../../../../python/x402", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
